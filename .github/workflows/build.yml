name: Build Windows and Android

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-glew
            git
            make
            python
      - name: Build Windows executable
        shell: msys2 {0}
        run: |
          set -euo pipefail
          if [ ! -f Makefile ]; then
            echo 'Missing Makefile: import the SM64 PC port source and build scripts first.' >&2
            exit 1
          fi
          make -j2
          mkdir -p dist/windows
          find . -type f -name '*.exe' ! -path './dist/*' -exec cp {} dist/windows/ \;
          test -n "$(find dist/windows -maxdepth 1 -name '*.exe' -print -quit)" || { echo 'Build completed but no EXE was produced.' >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Mario64Source-Windows
          path: dist/windows/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK and build tools
        run: |
          sdkmanager --install 'ndk;27.2.12479018' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
            (cd android && ./gradlew assembleDebug --no-daemon)
          elif [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo 'Missing Android Gradle project: integrate an Android-compatible SM64 port first.' >&2
            exit 1
          fi
          mkdir -p dist/android
          find . -type f -name '*.apk' ! -path './dist/*' -exec cp {} dist/android/ \;
          test -n "$(find dist/android -maxdepth 1 -name '*.apk' -print -quit)" || { echo 'Build completed but no APK was produced.' >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Mario64Source-Android
          path: dist/android/*.apk
          if-no-files-found: error
