name: Build Mario64Source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
      - name: Build Windows executable
        shell: msys2 {0}
        run: |
          if [ ! -f Makefile ]; then
            echo 'ERROR: Missing Makefile. Import a compatible Windows SM64 port first.' >&2
            exit 1
          fi
          make -j2
          mkdir -p dist/windows
          find . -type f -name '*.exe' -not -path './.git/*' -exec cp '{}' dist/windows/ \;
          test -n "$(find dist/windows -maxdepth 1 -name '*.exe' -print -quit)" || { echo 'ERROR: No EXE produced.' >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Mario64Source-Windows
          path: dist/windows/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK without legacy tools package
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER" || { echo 'sdkmanager not found' >&2; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          elif [ -f android/gradlew ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
            cd ..
          else
            echo 'ERROR: Missing Android Gradle project. Import an Android-compatible SM64 port first.' >&2
            exit 1
          fi
          mkdir -p dist/android
          find . -path '*/build/outputs/apk/*' -name '*.apk' -type f -exec cp '{}' dist/android/ \;
          test -n "$(find dist/android -maxdepth 1 -name '*.apk' -print -quit)" || { echo 'ERROR: No APK produced.' >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Mario64Source-Android
          path: dist/android/*.apk
          if-no-files-found: error
